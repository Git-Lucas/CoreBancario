# Sem host: regra catch-all, atende http://localhost no kind (via extraPortMappings do
# kind-config.yaml) e o endereço de qualquer outro cluster do mesmo jeito, sem DNS nem
# /etc/hosts — nenhum campo precisa mudar entre ambientes. Só a Api é exposta — banco, broker e
# Worker não têm Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: corebancario
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
