# Mesma razão do StatefulSet do PostgreSQL: identidade estável e PVC ligado ao ordinal, não
# redundância — evita dois pods montando o mesmo volume ReadWriteOnce durante uma atualização.
# Ponto de montagem em /var/lib/rabbitmq, o mesmo do docker-compose.yml e o volume declarado pela
# imagem rabbitmq:4-management.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: corebancario
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          envFrom:
            - configMapRef:
                name: corebancario-config
            - secretRef:
                name: corebancario-secrets
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 250m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
# Sem cabeçalho, como o do PostgreSQL: o painel de administração (porta 15672) fica alcançável
# dentro do cluster (kubectl port-forward, ou de outro pod), nunca pelo Ingress — só a Api é
# exposta externamente.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: corebancario
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
