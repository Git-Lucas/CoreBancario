# stringData (não data): aceita texto puro, o Kubernetes codifica em base64 na escrita — sem
# passo manual de base64. Credenciais de desenvolvimento, as mesmas do docker-compose.yml — base64
# não é criptografia, é codificação; o que protegeria de verdade (criptografia do etcd em repouso,
# RBAC restringindo leitura do Secret) não é exercitado aqui. Aceito porque são as mesmas
# credenciais que o docker-compose.yml já traz em texto claro.
apiVersion: v1
kind: Secret
metadata:
  name: corebancario-secrets
  namespace: corebancario
type: Opaque
stringData:
  POSTGRES_PASSWORD: "corebancario"
  RABBITMQ_DEFAULT_PASS: "corebancario"
  ConnectionStrings__CoreBancario: "Host=postgres;Port=5432;Database=corebancario;Username=corebancario;Password=corebancario"
  ConnectionStrings__RabbitMQ: "amqp://corebancario:corebancario@rabbitmq:5672"
