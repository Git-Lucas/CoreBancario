# Mesma forma da Api (replicas: 1 + Recreate — evita duas réplicas migrando em paralelo no
# startup, com Recreate garantindo um processo por vez em vez do RollingUpdate padrão). Sem sonda:
# o Worker não tem superfície HTTP, e as duas formas de parar de trabalhar (processo morto, que o
# Kubernetes já vê pelo estado do container, ou queda do broker, já coberta pela reconexão
# automática do cliente) já são visíveis sem uma probe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: corebancario
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: dockerlucasoliveira/corebancario-worker:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: corebancario-config
            - secretRef:
                name: corebancario-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 100m
              memory: 256Mi
