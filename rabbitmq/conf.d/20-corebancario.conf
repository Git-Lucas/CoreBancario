# Marca-d'água de memória em valor absoluto, abaixo do limite de memória do contêiner (512 MiB
# no docker-compose.yml e nos manifestos de Kubernetes). Sem isso, o broker calcula a marca como
# fração da memória detectada da MÁQUINA, não do limite do contêiner/cgroup — o que a deixa muito
# acima do teto real e faz o controle de fluxo nunca disparar antes do processo ser encerrado por
# limite de memória. Defeito latente do PRD-3, corrigido aqui (design.md da change
# add-observability, D12).
vm_memory_high_watermark.absolute = 384MiB
